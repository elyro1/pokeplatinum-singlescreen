; ROM hack-style quality-of-life preset; these are NOT the built-in defaults.
; Easier team building and less waiting, with original battle rules and catch/shiny rates.
; Copy to gameplay_config.ini in the game working directory, edit, and restart.
; Full guide: docs/gameplay_config.md
; Booleans: true/false, TRUE/FALSE, or 1/0. Numbers: non-negative integers.
; Missing options keep defaults. Delete the active file and restart to reset.

[Gameplay]

; Block player Bag items in battle except Poke Balls; held and opponent items are unaffected.
prohibitBattleItems=false
; Always use Set battle style, regardless of the saved Options selection.
forceSetBattleStyle=false

; Vitamins work past 100 EVs; normal per-stat and total EV limits still apply.
unlimitedVitaminEVs=true

; Global BP price percentage, rounded up: 100 = original, 0 = free.
; Range: 0-65535
bpPricePercent=50

; Exact Rare Candy BP price, overriding the percentage: 0 = free.
; Range: 0-65535
rareCandyBPPrice=1

; Allow HM moves to be replaced when learning another move.
forgettableHMs=true

; Use HMs with compatible party Pokemon without teaching them; badge and location restrictions still apply.
unlearnedHMs=true

; The Move Maniac requires no Heart Scale.
freeMoveRelearning=true

; Shard move tutors require no shards.
freeMoveTutors=true

; The Route 212 tutor offers all three shard tutors' move lists.
mainStoryMoveTutors=true

; Disable the Great Marsh step limit; entry fee and Safari Ball limit still apply.
unlimitedGreatMarshSteps=true

; New and existing eggs become ready to hatch at the next hatch check.
zeroEggCycles=false

; Skip the Honey Tree wait; normal encounter chances and expiration still apply.
instantHoneyTrees=true

; Teaching a move does not consume its TM.
infiniteTMs=true

; Held-item evolutions trigger on level-up at any time of day; the item is consumed.
levelUpHeldItemEvolutions=true

; Skip Underground conversations for Spiritomb; an Odd Keystone is still required.
instantSpiritomb=true

; Evolve Feebas with a Water Stone instead of Beauty.
feebasWaterStoneEvolution=true

; Skip walking poison damage; poison status and battle damage remain.
disableOverworldPoisonDamage=true

; Plain trade evolutions also trigger on level-up at this level: 1-100, or 0 to disable.
; Range: 0-100
tradeEvolutionLevel=40

; Total shiny rolls for new eligible Pokemon: 0 and 1 preserve original odds.
; Range: 0-65535
shinyRolls=1

; Multiply positive friendship gains: 0 and 1 preserve original gains.
; Range: 0-255
friendshipGainMultiplier=2

; Divide steps per hatch check by this value: 0 and 1 preserve original timing.
; Range: 0-255
eggHatchSpeedMultiplier=5

; Multiply final catch rate: 0 and 1 preserve original rates; trainer captures remain blocked.
; Range: 0-255
catchRateMultiplier=1

; Maximum visible wild Pokemon at once: 0 disables spawns.
; Range: 0-30
overworldEncounterCount=8
