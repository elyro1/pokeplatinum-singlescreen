name: build_linux

on:
  push:
    branches: [ pc_port, pc_single_screen_mod ]
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

env:
  LM_LICENSE_FILE: "${{ github.workspace }}/tools/cw/license.dat"
  BUILD: /var/tmp/pokeplatinum

jobs:
  build_linux:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Install Software
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends fuse git python3 wget zip

      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Metroskrew
        run: ./drun.sh make skrew

      - name: Build (Linux)
        run: ./drun.sh make linux

      - name: Verify gamepad input
        run: ./drun.sh python3 tools/scripts/test_gamepad_input.py

      - name: Verify gameplay config editor (C++17)
        run: ./drun.sh python3 tools/scripts/test_gameplay_config_editor.py

      - name: Verify embedded resource patches
        run: ./drun.sh python3 tools/scripts/test_map_patches.py

      - name: Build AppImage
        run: ./drun.sh ./tools/scripts/create_appimage.sh build_linux pokeplatinum

      - name: Package release artifact (linux)
        run: ./drun.sh ./tools/scripts/package_artifacts_linux.sh

      - name: Upload release artifact (linux)
        uses: actions/upload-artifact@v6
        with:
          name: release_linux
          path: build_linux/pokeplatinum/release_linux
